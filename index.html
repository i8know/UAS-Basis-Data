<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Paradise</title>
    <link rel="icon" href="data:,">
    <style>
        * {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  margin: 0;
  background: #f0f2f5;
}

/* Navbar */
.navbar {
  background: #1f2937;
  color: white;
  padding: 15px;
  text-align: center;
}

/* Feed container */
.feed {
  max-width: 680px;
  margin: 40px auto;
}

/* Post card */
.post {
  background: white;
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  transition: transform 0.2s;
}

.post:hover {
  transform: translateY(-2px);
}

/* Header post */
.post-header {
  display: flex;
  gap: 12px;
  align-items: center;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.username {
  font-weight: 600;
  font-size: 15px;
}

.meta {
  font-size: 12px;
  color: #6b7280;
}

/* Content */
.post-content {
  margin: 14px 0;
  font-size: 15px;
  line-height: 1.6;
  color: #111827;
}

/* Actions */
.post-actions {
  display: flex;
  gap: 24px;
  font-size: 14px;
  color: #6b7280;
}

.post-actions span {
  cursor: pointer;
}

.post-actions span:hover {
  color: #ef4444;
}

    </style>
</head>
<body>
    <div class="container">
        
        <!-- Posts Section -->
       <div class="feed" id="posts"></div>
       <header class="navbar">
       <h2>Anime Paradise</h2>
       </header>

       <main class="feed" id="posts"></main>
       <script src="script.js"></script>
        </div>

    <script>
        // API URL
        const API_URL = 'http://localhost:3000/api';

        // Load Posts
      let postsData = [];

async function loadPosts() {
  const res = await fetch('http://localhost:3000/api/posts');
  postsData = await res.json();

  const container = document.getElementById('posts');
  container.innerHTML = '';

  postsData.forEach((post, index) => {
    if (!post.likes) post.likes = 0;

    const username = post.User_ID || 'anonymous';

    const content = post.Feedback_Text || 'No content';

    const platform = post.Platform || 'Unknown';
    const sentiment = post.Sentiment || 'Neutral';

      JSON.stringify(post);

    const el = document.createElement('div');
    el.className = 'post';

      el.innerHTML = `
     <div class="post-header">
     <div class="avatar"></div>
     <div>
      <div class="username">${username}</div>
      <div class="meta">${platform} • ${sentiment}</div>
    </div>
    </div>

    <div class="post-content">
    ${content}
    </div>

    <div class="post-actions">
    <span onclick="likePost(${index})">❤️ ${post.likes}</span>
    <span>💬 ${post.Replies || 0}</span>
    <span>🔁 ${post.Shares || 0}</span>
    </div>
`;


    container.appendChild(el);
  });
}

function likePost(index) {
  postsData[index].likes++;
  document.getElementById(`like-${index}`).innerText =
    postsData[index].likes;
}

loadPosts();

        // Load on page ready
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, fetching data...');
            loadPosts();
        });
    </script>
</body>
</html>
